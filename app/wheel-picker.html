<title>럭키 룰렛</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Noto+Serif+KR:wght@600;700;900&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  /* ---------- Deliberate single palette: a dim, lamp-lit casino room.
     No light/dark toggle — the low, warm light is the point. ---------- */
  :root{
    --bg:#0A0A0C;
    --surface:#15171B;
    --surface-2:#1D2025;
    --border:#2B2E34;
    --ink:#EDE6D7;
    --ink-dim:#93897C;
    --gold-dark:#5E4712;
    --gold:#C6A030;
    --gold-bright:#F2DA8C;
    --felt:#0E3A2C;
    --felt-dark:#051911;
    --wine:#5C1224;
    --wine-bright:#8C2A3E;
    --shadow: 0 24px 60px -24px rgba(0,0,0,.85);
    color-scheme: dark;
  }

  *{box-sizing:border-box;}
  html,body{background:var(--bg);}
  body{
    color:var(--ink);
    font-family:'Noto Sans KR', system-ui, sans-serif;
    padding-inline:16px;
    background:
      radial-gradient(ellipse 90% 50% at 50% -6%, rgba(198,160,48,.10), rgba(198,160,48,0) 62%),
      var(--bg);
  }
  h1,h2{text-wrap:balance;}

  .app{
    max-width:1880px;
    margin:0 auto;
    padding-block:28px 56px;
    display:flex;
    flex-direction:column;
  }

  .screen{
    transition:opacity .35s ease, transform .35s ease;
  }
  .screen:not(.is-active){opacity:0; transform:translateY(6px);}
  .screen.is-active{opacity:1; transform:none;}
  @media (prefers-reduced-motion: reduce){
    .screen{transition-duration:.01s;}
  }

  /* ================= Screen 1 — Setup ================= */
  .screen-setup{
    max-width:720px;
    margin:0 auto;
    width:100%;
  }
  .setup-header{
    display:flex;
    flex-direction:column;
    gap:8px;
    margin-bottom:26px;
    text-align:center;
  }
  .eyebrow{
    font-family:'Cinzel', serif;
    font-size:12px;
    font-weight:600;
    letter-spacing:.22em;
    color:var(--gold);
    text-transform:uppercase;
    margin:0 auto;
  }
  .setup-header h1{
    font-family:'Noto Serif KR', serif;
    font-weight:900;
    font-size:clamp(26px,4vw,34px);
    margin:0;
    color:var(--gold-bright);
    text-shadow:0 0 24px rgba(242,218,140,.25);
  }
  .setup-header p{
    margin:0 auto;
    color:var(--ink-dim);
    font-size:14px;
    max-width:52ch;
    line-height:1.6;
  }

  .setup-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:16px;
    margin-bottom:22px;
  }
  @media (max-width:640px){
    .setup-grid{grid-template-columns:1fr;}
  }

  .card{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:14px;
    padding:20px 20px 22px;
    box-shadow:var(--shadow);
  }
  .card h2{
    font-size:13px;
    margin:0 0 4px;
    font-weight:700;
    letter-spacing:.03em;
    color:var(--ink);
  }
  .card .hint{
    font-size:12px;
    color:var(--ink-dim);
    margin:0 0 14px;
    line-height:1.5;
  }

  .add-row{
    display:flex;
    gap:8px;
    margin-bottom:12px;
  }
  .add-row input[type=text]{
    flex:1;
    min-width:0;
    padding:10px 12px;
    border-radius:9px;
    border:1px solid var(--border);
    background:var(--surface-2);
    color:var(--ink);
    font:inherit;
    font-size:14px;
  }
  .add-row input[type=text]::placeholder{color:var(--ink-dim);}
  .add-row input[type=text]:focus-visible,
  .add-row button:focus-visible,
  .chip button:focus-visible,
  input[type=checkbox]:focus-visible,
  .ghost-btn:focus-visible,
  .enter-btn:focus-visible,
  .back-btn:focus-visible,
  .spin-btn:focus-visible{
    outline:3px solid var(--gold-bright);
    outline-offset:2px;
  }
  .add-row button{
    padding:10px 16px;
    border-radius:9px;
    border:1px solid var(--border);
    background:var(--surface-2);
    color:var(--ink);
    font:inherit;
    font-weight:700;
    font-size:14px;
    cursor:pointer;
  }
  .add-row button:hover{background:var(--gold-dark);color:var(--gold-bright);border-color:var(--gold);}

  .chips{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
  }
  .chip{
    display:flex;
    align-items:center;
    gap:6px;
    padding:6px 8px 6px 14px;
    border-radius:999px;
    background:var(--surface-2);
    border:1px solid var(--border);
    font-size:13px;
  }
  .chip.done{opacity:.45; text-decoration:line-through;}
  .chip button{
    all:unset;
    cursor:pointer;
    width:18px;height:18px;
    border-radius:50%;
    display:grid;place-items:center;
    color:var(--ink-dim);
  }
  .chip button:hover{background:var(--wine); color:var(--ink);}

  .toggle-row{
    display:flex;
    align-items:center;
    gap:8px;
    font-size:13px;
    color:var(--ink-dim);
    margin-top:14px;
  }
  .toggle-row label{cursor:pointer; user-select:none;}

  .footer-row{
    display:flex;
    gap:8px;
    margin-top:14px;
  }
  .ghost-btn{
    padding:8px 14px;
    border-radius:9px;
    border:1px solid var(--border);
    background:transparent;
    color:var(--ink-dim);
    font:inherit;
    font-size:13px;
    cursor:pointer;
  }
  .ghost-btn:hover{color:var(--ink); border-color:var(--ink-dim);}

  .history{
    list-style:none;
    margin:0; padding:0;
    display:flex;
    flex-direction:column;
    gap:6px;
    max-height:260px;
    overflow-y:auto;
  }
  .history li{
    display:flex;
    justify-content:space-between;
    gap:10px;
    font-size:13px;
    padding:8px 10px;
    border-radius:8px;
    background:var(--surface-2);
  }
  .history .idx{color:var(--ink-dim); font-variant-numeric:tabular-nums;}
  .empty-note{font-size:13px; color:var(--ink-dim);}

  .enter-btn{
    display:block;
    margin:4px auto 0;
    font-family:'Noto Serif KR', serif;
    font-weight:700;
    font-size:16px;
    letter-spacing:.02em;
    padding:14px 34px;
    border-radius:999px;
    border:1px solid var(--gold-dark);
    background:linear-gradient(to bottom, var(--gold-bright), var(--gold) 55%, var(--gold-dark));
    color:#2A1E05;
    cursor:pointer;
    box-shadow:0 10px 24px -10px rgba(198,160,48,.55);
    transition:transform .15s ease, box-shadow .15s ease;
  }
  .enter-btn:hover{transform:translateY(-1px); box-shadow:0 14px 28px -10px rgba(198,160,48,.7);}

  /* ================= Screen 2 — Stage ================= */
  .screen-stage{
    position:relative;
    max-width:100%;
    margin:0 auto;
    width:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:16px;
    padding:26px 18px 34px;
    border-radius:22px;
    isolation:isolate;
  }
  .screen-stage::before{
    content:"";
    position:absolute;
    inset:-30px -20px;
    z-index:-1;
    border-radius:32px;
    background:
      radial-gradient(60% 46% at 50% 32%, rgba(242,218,140,.16), rgba(242,218,140,0) 68%),
      radial-gradient(130% 90% at 50% 100%, rgba(0,0,0,.65), rgba(0,0,0,0) 55%),
      #000000;
    pointer-events:none;
  }
  .back-btn{
    align-self:flex-start;
    padding:8px 14px;
    border-radius:9px;
    border:1px solid var(--border);
    background:rgba(255,255,255,.03);
    color:var(--ink-dim);
    font:inherit;
    font-size:13px;
    cursor:pointer;
  }
  .back-btn:hover{color:var(--ink); border-color:var(--ink-dim);}
  .stage-eyebrow{
    font-family:'Cinzel', serif;
    font-size:11px;
    font-weight:600;
    letter-spacing:.3em;
    color:var(--gold);
    text-transform:uppercase;
    margin-top:-6px;
  }

  /* ---------- Felt table the wheel sits on ----------
     The wheel itself scales by whichever is smaller — available width or a
     share of the viewport height — so it grows to fill a wide presentation
     screen instead of staying boxed at a fixed small size, while never
     overflowing top-to-bottom on a short/landscape window. */
  .wheel-card{
    width:100%;
    max-width:1420px;
    margin:0 auto;
    background:
      radial-gradient(120% 90% at 50% 26%, #1F6E4D 0%, #12492F 40%, #082C1C 74%, var(--felt-dark) 100%);
    border:1px solid #04120B;
    border-radius:20px;
    box-shadow:var(--shadow), inset 0 0 60px rgba(0,0,0,.5);
    padding:clamp(40px,5vw,72px) clamp(28px,4vw,56px) clamp(32px,4vw,64px);
  }
  .wheel-stage{
    position:relative;
    width:min(100%, 82vh, 1040px);
    margin:0 auto;
  }

  /* Camera: the wheel leans back (setDiscSquash) and grows slightly
     (setRigCamera) during a spin, but .wheel-viewport is never clipped —
     no overflow:hidden, and the rig scales from dead-center (50% 50%), so
     the whole disc + gold rim stays fully visible at every frame instead
     of being cropped against a fixed frame. The felt card's generous
     padding gives the modest zoom room to breathe. */
  .wheel-viewport{
    position:relative;
    width:100%;
    aspect-ratio:1/1;
  }
  .wheel-rig{
    position:absolute;
    inset:0;
    transform-origin:50% 50%;
    will-change:transform;
  }
  .wheel-shadow{
    position:absolute;
    left:50%;
    bottom:2%;
    width:80%;
    height:16%;
    transform:translateX(-50%);
    background:radial-gradient(closest-side, rgba(0,0,0,.6), rgba(0,0,0,0) 75%);
    filter:blur(5px);
    z-index:0;
    pointer-events:none;
  }
  .pointer{
    position:absolute;
    top:-2px;
    left:50%;
    transform:translateX(-50%);
    width:0;height:0;
    border-left:12px solid transparent;
    border-right:12px solid transparent;
    border-top:20px solid var(--gold-bright);
    filter:drop-shadow(0 2px 3px rgba(0,0,0,.6));
    z-index:4;
  }
  .wheel-disc{
    position:absolute;
    inset:0;
    transform-origin:50% 50%;
    will-change:transform;
  }
  /* A layered gold box-shadow stands in for a fluted, engraved bezel —
     alternating bright/dark rings read as a beveled metal edge without
     any extra image or SVG. */
  #wheel{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    display:block;
    border-radius:50%;
    box-shadow:
      0 0 0 3px var(--gold-dark),
      0 0 0 7px var(--gold),
      0 0 0 9px var(--gold-bright),
      0 0 0 12px var(--gold),
      0 0 0 17px var(--gold-dark),
      0 0 0 20px var(--gold),
      inset 0 0 26px rgba(0,0,0,.5),
      inset 0 0 3px rgba(255,255,255,.12),
      0 0 46px 8px rgba(242,200,120,.16);
  }
  .wheel-sheen{
    position:absolute;
    inset:0;
    border-radius:50%;
    background:radial-gradient(ellipse 58% 50% at 30% 16%, rgba(255,255,255,.32), rgba(255,255,255,0) 62%);
    pointer-events:none;
    z-index:3;
  }
  #confetti{
    position:absolute;
    inset:-18% -12%;
    pointer-events:none;
    z-index:6;
  }

  .spin-btn{
    font-family:'Noto Serif KR','Noto Sans KR',sans-serif;
    font-weight:700;
    font-size:clamp(19px,1.6vw,24px);
    letter-spacing:.04em;
    padding:clamp(13px,1.2vw,17px) clamp(40px,4vw,54px);
    border-radius:999px;
    border:1px solid var(--gold-dark);
    background:linear-gradient(to bottom, var(--gold-bright), var(--gold) 55%, var(--gold-dark));
    color:#2A1E05;
    cursor:pointer;
    box-shadow:0 8px 20px -8px rgba(198,160,48,.6);
    transition:transform .15s ease, box-shadow .15s ease, opacity .15s ease;
  }
  .spin-btn:hover:not(:disabled){transform:translateY(-1px); box-shadow:0 12px 24px -8px rgba(198,160,48,.75);}
  .spin-btn:disabled{opacity:.4; cursor:not-allowed;}

  .result{
    min-height:28px;
    font-family:'Noto Serif KR','Noto Sans KR',sans-serif;
    font-weight:700;
    font-size:clamp(22px,2vw,30px);
    color:var(--gold-bright);
    text-align:center;
    opacity:0;
    transform:scale(.85);
    transition:opacity .35s ease, transform .35s cubic-bezier(.34,1.56,.64,1);
  }
  .result.show{opacity:1; transform:scale(1);}
  @media (prefers-reduced-motion: reduce){
    .result{transition-duration:.01s;}
  }
</style>

<div class="app">

  <section id="screenSetup" class="screen screen-setup is-active">
    <header class="setup-header">
      <span class="eyebrow">Classroom Roulette</span>
      <h1>럭키 룰렛</h1>
      <p>참가자를 넣고 무대로 이동하면, 룰렛만 크게 보이는 화면에서 돌릴 수 있어요. 발표 순서 정하기, 모둠 뽑기, 자리 배치, 퀴즈 문제 선택 등에 그대로 쓸 수 있습니다. 이름은 자유롭게 바꿔서 써보세요 — 예시가 채워져 있습니다.</p>
    </header>

    <div class="setup-grid">
      <div class="card">
        <h2>참가자</h2>
        <p class="hint">Enter 또는 추가 버튼으로 이름을 넣으세요. 최소 2명 필요합니다.</p>
        <div class="add-row">
          <input type="text" id="nameInput" placeholder="이름 입력 후 Enter" maxlength="12">
          <button type="button" id="addBtn">추가</button>
        </div>
        <div class="chips" id="chips"></div>
        <div class="toggle-row">
          <input type="checkbox" id="excludeToggle">
          <label for="excludeToggle">뽑힌 사람은 다음 판에서 제외하기</label>
        </div>
        <div class="footer-row">
          <button type="button" class="ghost-btn" id="resetBtn">초기화 (제외·기록 지우기)</button>
        </div>
      </div>

      <div class="card">
        <h2>뽑힌 기록</h2>
        <ul class="history" id="history"></ul>
        <p class="empty-note" id="historyEmpty">아직 뽑은 기록이 없습니다.</p>
      </div>
    </div>

    <button class="enter-btn" id="enterStageBtn" type="button">룰렛 무대로 이동 →</button>
  </section>

  <section id="screenStage" class="screen screen-stage" hidden>
    <button class="back-btn" id="backBtn" type="button">← 참가자 수정</button>
    <span class="stage-eyebrow">Lucky Wheel</span>

    <div class="wheel-card">
      <div class="wheel-stage">
        <div class="wheel-viewport">
          <div class="wheel-rig" id="wheelRig">
            <div class="wheel-shadow" aria-hidden="true"></div>
            <div class="pointer" aria-hidden="true"></div>
            <div class="wheel-disc" id="wheelDisc">
              <canvas id="wheel" width="900" height="900" role="img" aria-label="참가자 이름이 적힌 돌림판"></canvas>
              <div class="wheel-sheen" aria-hidden="true"></div>
            </div>
          </div>
        </div>
        <canvas id="confetti" aria-hidden="true"></canvas>
      </div>
    </div>

    <button class="spin-btn" id="spinBtn" type="button">돌리기</button>
    <div class="result" id="result" role="status" aria-live="polite"></div>
  </section>

</div>

<script>
(function(){
  "use strict";

  var STORE_KEY = "wheel-picker-names-v1";
  var reduceMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  // ---------- Wheel segment palette ----------
  // Deep jewel tones (garnet / emerald / sapphire / amethyst / antique gold /
  // onyx / copper / teal slate) instead of primary colors, closer to a real
  // roulette wheel's restrained, lamp-lit palette. Each slice is a radial
  // gradient from `inner` (near the hub) to `outer` (near the rim) so the
  // wedges read as curved, lit surfaces instead of flat paint.
  var slicePalette = [
    {inner:"#B23A54", outer:"#530F22"},
    {inner:"#2E9270", outer:"#0A3A2A"},
    {inner:"#4A66C4", outer:"#131F45"},
    {inner:"#9457B8", outer:"#3B1650"},
    {inner:"#D3AA4E", outer:"#5C4310"},
    {inner:"#43434B", outer:"#141417"},
    {inner:"#CC7A3E", outer:"#5C2A0E"},
    {inner:"#4C8484", outer:"#173030"}
  ];
  var confettiColors = slicePalette.map(function(p){ return p.inner; }).concat(["#F2DA8C","#C6A030"]);

  // ---------- Camera move (spin → lean back → grow slightly) ----------
  // REST_SQUASH: the wheel is a plain circle when nothing is happening.
  // TARGET_SQUASH: vertical scale once fully leaned back. A literal cos(15°)
  // (~0.97) is nearly indistinguishable from a full circle on screen, so the
  // value here is chosen to actually read as "reclining," not a literal
  // degree conversion.
  // TARGET_SCALE: the rig grows by this much, scaling from dead-center
  // (see .wheel-rig's transform-origin) and never clipped by the viewport —
  // the whole disc, gold rim included, stays on screen at every frame.
  var REST_SQUASH = 1;
  var TARGET_SQUASH = 0.45;
  var TARGET_SCALE = 1.14;

  var defaultNames = ["김민준","이서연","박도윤","최지우","정하은","강주원"];

  var state = {
    names: [],      // [{name, done}]
    history: []     // [{name, ts}]
  };

  function loadState(){
    try{
      var raw = localStorage.getItem(STORE_KEY);
      if(raw){
        var parsed = JSON.parse(raw);
        if(Array.isArray(parsed) && parsed.length){
          state.names = parsed.map(function(n){ return {name:n.name, done:false}; });
          return;
        }
      }
    }catch(e){ /* storage unavailable — fall back to example names */ }
    state.names = defaultNames.map(function(n){ return {name:n, done:false}; });
  }

  function saveState(){
    try{
      localStorage.setItem(STORE_KEY, JSON.stringify(state.names.map(function(n){return {name:n.name};})));
    }catch(e){ /* ignore — per-viewer convenience only */ }
  }

  // ---------- Wheel drawing ----------
  // drawWheel always renders a plain circle at full size; the "leaning back"
  // look is applied afterward as a single CSS scaleY on .wheel-disc (see
  // setDiscSquash below), so the gold rim, the wedges and the gloss all
  // flatten together as one piece.
  var canvas = document.getElementById("wheel");
  var ctx = canvas.getContext("2d");
  var confettiCanvas = document.getElementById("confetti");
  var confettiCtx = confettiCanvas.getContext("2d");
  var spinBtn = document.getElementById("spinBtn");
  var resultEl = document.getElementById("result");
  var rigEl = document.getElementById("wheelRig");
  var discEl = document.getElementById("wheelDisc");

  var currentAngle = 0; // radians, accumulates across spins — never reset, so it always spins forward
  var spinning = false;

  function activeSlices(){
    return state.names.filter(function(n){ return !n.done; });
  }

  function normalizeRad(a){
    var twoPi = Math.PI*2;
    return ((a % twoPi) + twoPi) % twoPi;
  }

  function drawWheel(angle){
    var slices = activeSlices();
    var n = Math.max(slices.length, 1);
    var W = canvas.width, H = canvas.height;
    var cx = W/2, cy = H/2;
    var rx = W/2 - 34;
    var segRad = (Math.PI*2) / n;

    ctx.clearRect(0,0,W,H);

    if(slices.length === 0){
      ctx.beginPath();
      ctx.arc(cx,cy,rx,0,Math.PI*2);
      ctx.fillStyle = getComputedStyle(document.body).getPropertyValue('--surface-2') || '#1D2025';
      ctx.fill();
      return;
    }

    for(var i=0;i<n;i++){
      var start = -Math.PI/2 + i*segRad + angle;
      var end = start + segRad;
      var tones = slicePalette[i % slicePalette.length];

      ctx.beginPath();
      ctx.moveTo(cx,cy);
      ctx.arc(cx,cy, rx, start, end);
      ctx.closePath();

      var grad = ctx.createRadialGradient(cx,cy, rx*0.06, cx,cy, rx);
      grad.addColorStop(0, tones.inner);
      grad.addColorStop(1, tones.outer);
      ctx.fillStyle = grad;
      ctx.fill();

      // dark undercoat + bright gold pinstripe — reads as a beveled metal
      // divider between wedges instead of a flat line
      ctx.lineWidth = 5.8;
      ctx.strokeStyle = "rgba(0,0,0,.55)";
      ctx.stroke();
      ctx.lineWidth = 1.8;
      ctx.strokeStyle = "#F2DA8C";
      ctx.stroke();

      var mid = start + segRad/2;
      var labelR = rx * 0.6;
      var lx = cx + Math.cos(mid)*labelR;
      var ly = cy + Math.sin(mid)*labelR;

      ctx.save();
      ctx.translate(lx,ly);
      ctx.rotate(mid);
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillStyle = "#F5EEDF";
      ctx.font = "700 30px 'Noto Sans KR', sans-serif";
      ctx.shadowColor = "rgba(0,0,0,.6)";
      ctx.shadowBlur = 5;
      var label = slices[i].name;
      if(label.length > 8) label = label.slice(0,7) + "…";
      ctx.fillText(label, 0, 0);
      ctx.restore();
    }

    // inner rim ring, echoing the outer gold bezel for continuity
    ctx.beginPath();
    ctx.arc(cx,cy,rx,0,Math.PI*2);
    ctx.lineWidth = 5.1;
    ctx.strokeStyle = "rgba(0,0,0,.5)";
    ctx.stroke();
    ctx.lineWidth = 2.6;
    ctx.strokeStyle = "#F2DA8C";
    ctx.stroke();

    // small polished gold hub cap at the center — a plain, quiet finishing
    // touch (no ornament/mascot on it)
    var hubR = rx * 0.09;
    var hubGrad = ctx.createRadialGradient(cx - hubR*0.3, cy - hubR*0.35, hubR*0.1, cx, cy, hubR);
    hubGrad.addColorStop(0, "#F8E7AE");
    hubGrad.addColorStop(0.55, "#C6A030");
    hubGrad.addColorStop(1, "#5E4712");
    ctx.beginPath();
    ctx.arc(cx,cy,hubR,0,Math.PI*2);
    ctx.fillStyle = hubGrad;
    ctx.fill();
    ctx.lineWidth = 2.6;
    ctx.strokeStyle = "rgba(0,0,0,.5)";
    ctx.stroke();
  }

  function setRigCamera(scale){
    rigEl.style.transform = scale === 1 ? "" : "scale(" + scale + ")";
  }

  function setDiscSquash(squash){
    discEl.style.transform = squash === 1 ? "" : "scaleY(" + squash + ")";
  }

  // Editing the list (adding/removing a name, resetting) always shows the
  // plain, un-zoomed circle — the camera move only happens during an actual spin.
  function showRestWheel(){
    drawWheel(currentAngle);
    setDiscSquash(REST_SQUASH);
    setRigCamera(1);
  }

  function spin(){
    if(spinning) return;
    var slices = activeSlices();
    if(slices.length < 2){
      resultEl.textContent = "참가자가 2명 이상 있어야 돌릴 수 있어요.";
      resultEl.classList.add("show");
      return;
    }

    spinning = true;
    spinBtn.disabled = true;
    resultEl.classList.remove("show");

    var n = slices.length;
    var segRad = (Math.PI*2) / n;
    var winnerIndex = Math.floor(Math.random() * n);

    // jitter keeps the pointer off dead-center for a more natural landing,
    // but stays safely inside the slice (60% of its width)
    var jitter = (Math.random() - 0.5) * segRad * 0.6;
    var targetCenter = (winnerIndex + 0.5) * segRad + jitter;
    var required = normalizeRad(-targetCenter);

    var currentMod = normalizeRad(currentAngle);
    var diff = normalizeRad(required - currentMod);
    var extraTurns = 6 + Math.floor(Math.random()*3); // 6-8 full spins for visual weight

    var startAngle = currentAngle;
    var targetAngle = currentAngle + extraTurns*Math.PI*2 + diff;
    var duration = reduceMotion ? 700 : 4200;
    var startTime = null;

    // The camera move rides on the same 0..1 timeline as the spin, but only
    // occupies the CAM_START..CAM_END slice of it: a plain-circle beat first,
    // then the lean-and-zoom, finishing with a little runway before the wheel
    // actually stops so the last few decelerating turns land already framed tight.
    var camStart = reduceMotion ? 1 : 0.12;
    var camEnd = reduceMotion ? 1 : 0.82;

    function easeOutCubic(t){ return 1 - Math.pow(1-t, 3); }

    function frame(ts){
      if(startTime === null) startTime = ts;
      var t = Math.min(1, (ts - startTime) / duration);
      currentAngle = startAngle + (targetAngle - startAngle) * easeOutCubic(t);

      var camT = camEnd > camStart ? Math.min(1, Math.max(0, (t - camStart) / (camEnd - camStart))) : 1;
      var camEase = easeOutCubic(camT);
      var squashNow = REST_SQUASH + (TARGET_SQUASH - REST_SQUASH) * camEase;
      var scaleNow = 1 + (TARGET_SCALE - 1) * camEase;

      drawWheel(currentAngle);
      setDiscSquash(squashNow);
      setRigCamera(scaleNow);

      if(t < 1){
        requestAnimationFrame(frame);
      }else{
        currentAngle = targetAngle;
        drawWheel(currentAngle);
        setDiscSquash(TARGET_SQUASH);
        setRigCamera(TARGET_SCALE);
        finishSpin(slices, winnerIndex);
      }
    }
    requestAnimationFrame(frame);
  }

  function finishSpin(slices, winnerIndex){
    spinning = false;
    spinBtn.disabled = false;
    var winner = slices[winnerIndex];
    resultEl.textContent = winner.name + " 당첨!";
    resultEl.classList.add("show");

    state.history.unshift({name: winner.name, ts: Date.now()});
    if(state.history.length > 30) state.history.pop();

    if(document.getElementById("excludeToggle").checked){
      var target = state.names.find(function(n){ return n.name === winner.name && !n.done; });
      if(target) target.done = true;
    }

    renderChips();
    renderHistory();
    if(!reduceMotion) burstConfetti();
  }

  // ---------- Confetti ----------
  function sizeConfettiCanvas(){
    var rect = confettiCanvas.getBoundingClientRect();
    confettiCanvas.width = Math.max(1, Math.round(rect.width));
    confettiCanvas.height = Math.max(1, Math.round(rect.height));
  }

  function burstConfetti(){
    sizeConfettiCanvas();
    var W = confettiCanvas.width, H = confettiCanvas.height;
    var particles = [];
    var count = 70;
    for(var i=0;i<count;i++){
      particles.push({
        x: W/2,
        y: H*0.4,
        vx: (Math.random()-0.5) * 14,
        vy: -Math.random()*10 - 4,
        g: 0.35 + Math.random()*0.15,
        size: 5 + Math.random()*5,
        color: confettiColors[Math.floor(Math.random()*confettiColors.length)],
        rot: Math.random()*Math.PI,
        vr: (Math.random()-0.5)*0.3,
        life: 70 + Math.random()*20
      });
    }
    var frame = 0;
    function tick(){
      frame++;
      confettiCtx.clearRect(0,0,W,H);
      var alive = false;
      particles.forEach(function(p){
        if(p.life <= 0) return;
        alive = true;
        p.vy += p.g;
        p.x += p.vx;
        p.y += p.vy;
        p.rot += p.vr;
        p.life--;
        confettiCtx.save();
        confettiCtx.globalAlpha = Math.max(0, Math.min(1, p.life/25));
        confettiCtx.translate(p.x,p.y);
        confettiCtx.rotate(p.rot);
        confettiCtx.fillStyle = p.color;
        confettiCtx.fillRect(-p.size/2,-p.size/2,p.size,p.size*0.6);
        confettiCtx.restore();
      });
      if(alive && frame < 130){
        requestAnimationFrame(tick);
      }else{
        confettiCtx.clearRect(0,0,W,H);
      }
    }
    tick();
  }

  // ---------- Chips / list management ----------
  var chipsEl = document.getElementById("chips");
  var nameInput = document.getElementById("nameInput");
  var addBtn = document.getElementById("addBtn");

  function renderChips(){
    chipsEl.innerHTML = "";
    state.names.forEach(function(n, idx){
      var chip = document.createElement("div");
      chip.className = "chip" + (n.done ? " done" : "");
      var span = document.createElement("span");
      span.textContent = n.name;
      var btn = document.createElement("button");
      btn.type = "button";
      btn.setAttribute("aria-label", n.name + " 삭제");
      btn.textContent = "✕";
      btn.addEventListener("click", function(){
        state.names.splice(idx,1);
        saveState();
        renderChips();
        showRestWheel();
      });
      chip.appendChild(span);
      chip.appendChild(btn);
      chipsEl.appendChild(chip);
    });
  }

  function addName(){
    var v = nameInput.value.trim();
    if(!v) return;
    state.names.push({name:v, done:false});
    nameInput.value = "";
    saveState();
    renderChips();
    showRestWheel();
  }

  addBtn.addEventListener("click", addName);
  nameInput.addEventListener("keydown", function(e){
    if(e.key === "Enter"){ e.preventDefault(); addName(); }
  });

  // ---------- History ----------
  var historyEl = document.getElementById("history");
  var historyEmpty = document.getElementById("historyEmpty");

  function renderHistory(){
    historyEl.innerHTML = "";
    if(state.history.length === 0){
      historyEmpty.style.display = "";
      return;
    }
    historyEmpty.style.display = "none";
    state.history.forEach(function(h, i){
      var li = document.createElement("li");
      var left = document.createElement("span");
      left.textContent = h.name;
      var right = document.createElement("span");
      right.className = "idx";
      right.textContent = "#" + (state.history.length - i);
      li.appendChild(left);
      li.appendChild(right);
      historyEl.appendChild(li);
    });
  }

  // ---------- Reset ----------
  document.getElementById("resetBtn").addEventListener("click", function(){
    state.names.forEach(function(n){ n.done = false; });
    state.history = [];
    resultEl.classList.remove("show");
    renderChips();
    renderHistory();
    showRestWheel();
  });

  document.getElementById("excludeToggle").addEventListener("change", function(){
    if(!this.checked){
      state.names.forEach(function(n){ n.done = false; });
      renderChips();
      showRestWheel();
    }
  });

  spinBtn.addEventListener("click", spin);
  window.addEventListener("resize", sizeConfettiCanvas);

  // ---------- Screen switching (setup ⇄ stage) ----------
  var screenSetup = document.getElementById("screenSetup");
  var screenStage = document.getElementById("screenStage");

  document.getElementById("enterStageBtn").addEventListener("click", function(){
    screenSetup.hidden = true;
    screenSetup.classList.remove("is-active");
    screenStage.hidden = false;
    // the stage canvas was hidden (0×0) until now, so its pixel size must be
    // (re)measured before drawing confetti into it
    sizeConfettiCanvas();
    requestAnimationFrame(function(){ screenStage.classList.add("is-active"); });
  });

  document.getElementById("backBtn").addEventListener("click", function(){
    screenStage.hidden = true;
    screenStage.classList.remove("is-active");
    screenSetup.hidden = false;
    requestAnimationFrame(function(){ screenSetup.classList.add("is-active"); });
  });

  // ---------- Boot ----------
  function start(){
    loadState();
    renderChips();
    renderHistory();
    sizeConfettiCanvas();
    showRestWheel();
  }

  if(window.claude && window.claude.hot && window.claude.hot.ready){
    window.claude.hot.ready(start);
  } else {
    start();
  }
})();
</script>
